appId: de.nexus.app
productName: NEXUS
directories:
  output: C:/nexus-release
files:
  - dist/**/*
  - electron/**/*
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico